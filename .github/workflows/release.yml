name: Release Obsidian plugin

# Push a tag that matches the version in manifest.json (for example 5.2.0, no "v")
# and this builds the plugin, runs the tests and publishes the GitHub release
# that Obsidian downloads from.
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version"
            exit 1
          fi

      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test

      # Signed build provenance, recommended by the directory. It depends on an
      # outside service (Sigstore), so it is tried twice, a minute apart, and if
      # both tries fail the release still goes out.
      - name: Generate artifact attestation
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Wait before retrying the attestation
        if: steps.attest.outcome == 'failure'
        run: sleep 60

      - name: Generate artifact attestation (second try)
        if: steps.attest.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            main.js manifest.json styles.css
